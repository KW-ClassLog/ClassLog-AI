services:
  ai:
    build:
      context: ./  # AI 서버 코드가 있는 디렉토리 경로
    container_name: classlog-ai
    ports:
      - "8000:8000"  # AI 서버 포트
    networks:
      - classlog-network
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VECTOR_DIR: "/data/vectorstores"
      TESSDATA_PREFIX: "/usr/share/tesseract-ocr/5/tessdata"
    volumes:
      - ./data/vectorstores:/data/vectorstores

networks:
  classlog-network:
    driver: bridge